services:
  app:
    build: .
    container_name: books_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: book_catalog
      DB_USER: books_user
      DB_PASSWORD: books_pass
    volumes:
      - .:/var/www/html
      - assets_data:/var/www/html/assets
      - vendor_data:/var/www/html/vendor
      - uploads_data:/var/www/html/uploads
      - runtime_data:/var/www/html/protected/runtime
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    container_name: books_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      book_catalog
      MYSQL_USER:          books_user
      MYSQL_PASSWORD:      books_pass
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "books_user", "-pbooks_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads_data:
  runtime_data:
  vendor_data:
  assets_data:
